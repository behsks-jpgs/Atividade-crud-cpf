<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD por CPF - Editar (PUT)</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topo">
        <div class="conteudo">
            <a class="marca" href="/">CRUD <span>| Busca por CPF</span></a>
            <nav class="menu">
                <a href="/">Início</a>
                <a href="/post/">Cadastrar</a>
                <a href="/get/">Listar</a>
                <a href="/put/" class="ativo">Editar</a>
                <a href="/delete/">Excluir</a>
            </nav>
        </div>
    </header>

    <main>
        <h1><span class="metodo put">PUT</span>Editar pessoa</h1>
        <p class="subtitulo">Busque o registro pelo CPF, altere os dados e clique em Atualizar.</p>

        <div id="mensagem" class="mensagem"></div>

        <!-- 1) Busca por CPF -->
        <form id="formBusca" class="cartao busca" autocomplete="off">
            <div class="campo">
                <label for="cpfBusca">CPF do registro</label>
                <input type="text" id="cpfBusca" placeholder="Digite o CPF para busca" maxlength="14" required>
            </div>
            <button type="submit">Buscar</button>
        </form>

        <!-- 2) Formulário de edição (liberado após a busca) -->
        <form id="formEditar" class="cartao" autocomplete="off">
            <fieldset id="campos" disabled>
                <h2>Dados pessoais</h2>
                <div class="grade-campos">
                    <div class="campo">
                        <label for="id">ID</label>
                        <input type="text" id="id" readonly>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" maxlength="14" required>
                    </div>
                    <div class="campo">
                        <label for="rg">RG</label>
                        <input type="text" id="rg" required>
                    </div>
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="campo">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="campo">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" min="0" max="130" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" maxlength="15" required>
                    </div>
                </div>

                <h2 style="margin-top: 24px;">Endereço</h2>
                <div class="grade-campos">
                    <div class="campo largo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" required>
                    </div>
                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" required>
                    </div>
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" required>
                    </div>
                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select id="estado" required>
                            <option value="">Selecione</option>
                            <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
                            <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                            <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
                            <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
                            <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                            <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
                            <option>SP</option><option>SE</option><option>TO</option>
                        </select>
                    </div>
                </div>

                <div class="acoes">
                    <button type="submit" class="botao laranja">Atualizar</button>
                    <button type="button" id="btnCancelar" class="botao secundario">Cancelar</button>
                    <a href="/get/" class="botao secundario">Ver lista</a>
                </div>
            </fieldset>
        </form>
    </main>

    <footer>Programação para Internet — UMC</footer>

    <script src="/put/put.js"></script>
</body>
</html>
