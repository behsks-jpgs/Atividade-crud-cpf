<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD por CPF - Cadastrar (POST)</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topo">
        <div class="conteudo">
            <a class="marca" href="/">CRUD <span>| Busca por CPF</span></a>
            <nav class="menu">
                <a href="/">Início</a>
                <a href="/post/" class="ativo">Cadastrar</a>
                <a href="/get/">Listar</a>
                <a href="/put/">Editar</a>
                <a href="/delete/">Excluir</a>
            </nav>
        </div>
    </header>

    <main>
        <h1><span class="metodo post">POST</span>Cadastrar pessoa</h1>
        <p class="subtitulo">Preencha os dados abaixo para adicionar um novo registro.</p>

        <div id="mensagem" class="mensagem"></div>

        <form id="formCadastro" class="cartao" autocomplete="off">
            <h2>Dados pessoais</h2>
            <div class="grade-campos">
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>
                <div class="campo">
                    <label for="rg">RG</label>
                    <input type="text" id="rg" placeholder="00.000.000-0" required>
                </div>
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="campo">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" required>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="nome@email.com" required>
                </div>
                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" min="0" max="130" required>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="(11) 90000-0000" maxlength="15" required>
                </div>
            </div>

            <h2 style="margin-top: 24px;">Endereço</h2>
            <div class="grade-campos">
                <div class="campo largo">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" placeholder="Rua, número" required>
                </div>
                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" required>
                </div>
                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" required>
                </div>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" required>
                        <option value="">Selecione</option>
                        <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
                        <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                        <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
                        <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
                        <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                        <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
                        <option>SP</option><option>SE</option><option>TO</option>
                    </select>
                </div>
            </div>

            <div class="acoes">
                <button type="submit" class="botao verde">Cadastrar</button>
                <button type="reset" class="botao secundario">Limpar</button>
                <a href="/get/" class="botao secundario">Ver lista</a>
            </div>
        </form>
    </main>

    <footer>Programação para Internet — UMC</footer>

    <script src="/post/post.js"></script>
</body>
</html>
